name: Frahoosh Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    name: Build Frahoosh APK

    runs-on: ubuntu-22.04


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            build-essential


      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          pip install \
            cython==0.29.36 \
            buildozer==1.5.0
                  - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "         VERIFY FRAHOOSH APK"
          echo "========================================"

          test -d bin

          echo "Contents of bin:"
          ls -lah bin/

          APK_COUNT="$(find bin -maxdepth 1 -type f -name '*.apk' | wc -l)"

          echo "APK COUNT: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            echo "Build directory contents:"
            find . -maxdepth 3 -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true
            exit 1
          fi

          echo "APK SUCCESSFULLY CREATED."

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print


      - name: Show APK information
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          test -n "$APK"
          test -f "$APK"

          echo "========================================"
          echo "          FRAHOOSH APK READY"
          echo "========================================"

          echo "APK FILE:"
          echo "$APK"

          echo "APK SIZE:"
          du -h "$APK"

          echo "APK SHA256:"
          sha256sum "$APK"


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14


      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "          FRAHOOSH BUILD SUMMARY"
          echo "========================================"

          echo "Repository: frahoosh-final"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"

          if [ -d bin ]; then
            echo ""
            echo "BIN DIRECTORY:"
            ls -lah bin/ || true

            echo ""
            echo "GENERATED APK FILES:"
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print || true
          else
            echo "bin directory does not exist."
          fi

          echo "========================================"

            
