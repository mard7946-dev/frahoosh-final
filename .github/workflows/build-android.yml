name: Frahoosh Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Install system packages
        run: |

          sudo apt update

          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev


      - name: Install build tools
        run: |

          python -m pip install --upgrade pip

          pip install \
            cython==0.29.36 \
            buildozer==1.5.0


      - name: Setup Android SDK
        run: |

          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"


      - name: Build APK
        run: |

          buildozer android debug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:

          name: frahoosh-apk

          path: bin/*.apk
