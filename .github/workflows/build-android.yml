name: Frahoosh Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    name: Build Frahoosh APK

    runs-on: ubuntu-22.04


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            build-essential


      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          pip install \
            cython==0.29.36 \
            buildozer==1.5.0


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android packages
        shell: bash
        run: |

          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"

          sdkmanager --install \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "cmdline-tools;latest" \
          "ndk;28.2.13676358"


          yes | sdkmanager --licenses || true


          echo "ANDROIDSDK=$SDK"

          ls -lah "$SDK/build-tools"

          ls -lah "$SDK/platform-tools"



      - name: Configure Android Environment
        shell: bash
        run: |

          SDK="$ANDROID_SDK_ROOT"

          NDK="$SDK/ndk/28.2.13676358"


          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV

          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK" >> $GITHUB_ENV


          echo "PATH=$SDK/build-tools/35.0.0:$PATH" >> $GITHUB_ENV



      - name: Prepare Buildozer directories
        run: |

          mkdir -p ~/.buildozer/android/platform

          mkdir -p ~/.buildozer/android/platform/android-sdk


          ln -sfn \
          "$ANDROID_SDK_ROOT/build-tools" \
          ~/.buildozer/android/platform/android-sdk/build-tools


          ln -sfn \
          "$ANDROID_SDK_ROOT/platforms" \
          ~/.buildozer/android/platform/android-sdk/platforms


          ln -sfn \
          "$ANDROID_SDK_ROOT/platform-tools" \
          ~/.buildozer/android/platform/android-sdk/platform-tools


          ln -sfn \
          "$ANDROID_SDK_ROOT/ndk" \
          ~/.buildozer/android/platform/android-sdk/ndk



      - name: Create Supabase runtime config
        env:
          FRAHOOSH_SUPABASE_URL: ${{ secrets.FRAHOOSH_SUPABASE_URL }}
          FRAHOOSH_SUPABASE_ANON_KEY: ${{ secrets.FRAHOOSH_SUPABASE_ANON_KEY }}

        run: |

          python - <<'PY'

          import json
          import os
          from pathlib import Path


          data={

          "FRAHOOSH_SUPABASE_URL":
          os.environ["FRAHOOSH_SUPABASE_URL"],


          "FRAHOOSH_SUPABASE_ANON_KEY":
          os.environ["FRAHOOSH_SUPABASE_ANON_KEY"]

          }


          Path(
          "mobile/runtime_config.json"
          ).write_text(

          json.dumps(
          data,
          ensure_ascii=False,
          indent=2
          ),

          encoding="utf-8"

          )

          PY



      - name: Validate source
        run: |

          python -m compileall -q mobile


          test -f buildozer.spec
          test -f main.py
          test -f mobile/screens/login.py
          test -f mobile/screens/dashboard.py



      - name: Clean Buildozer
        run: |

          rm -rf bin

          mkdir bin



      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

        run: |

          set -euxo pipefail


          echo "SDK:"
          echo $ANDROID_SDK_ROOT


          echo "NDK:"
          echo $ANDROID_NDK_HOME


          buildozer --version


          buildozer android debug



      - name: Verify APK
        run: |

          ls -lah bin/


          test -n "$(find bin -name '*.apk')"


          echo "APK CREATED"



      - name: Upload APK
        if: success()

        uses: actions/upload-artifact@v4

        with:

          name: Frahoosh-APK

          path: bin/*.apk

          retention-days: 14                   
                    
