name: Frahoosh Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install system dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            build-essential


      - name: Install Build tools
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip

          pip install \
            "cython==0.29.36" \
            "buildozer==1.5.0"


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" platform-tools
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"
          "$SDKMANAGER" "ndk;28.2.13676358"


      - name: Configure Android SDK compatibility
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_SDK_ROOT"

          echo "Fixing old Buildozer sdkmanager path"

          rm -rf "$SDK/tools"

          mkdir -p "$SDK/tools/bin"

          ln -sf \
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
          "$SDK/tools/bin/sdkmanager"


          test -x "$SDK/tools/bin/sdkmanager"


          echo "SDK Manager:"
          "$SDK/tools/bin/sdkmanager" --version


      - name: Validate Python source
        shell: bash
        run: |
          set -euxo pipefail

          python -m compileall -q mobile


      - name: Prepare Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          test -f buildozer.spec

          buildozer --version


      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================"
          echo "BUILD FRAHOOSH APK"
          echo "================================"

          echo "ANDROID SDK:"
          echo "$ANDROID_SDK_ROOT"

          buildozer android debug


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-APK
          path: bin/*.apk
          if-no-files-found: error
                        
