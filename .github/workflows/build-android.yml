name: Frahoosh Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Python build tools
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "cython==0.29.36" \
            buildozer \
            virtualenv

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "ANDROID SDK CONFIGURATION"
          echo "=========================================="

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.buildozer/android/platform/android-sdk}}"

          echo "SDK_ROOT=$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          mkdir -p "$SDK_ROOT"

          if [ -d "$SDK_ROOT/cmdline-tools/latest/bin" ]; then
            echo "Found sdkmanager in cmdline-tools/latest/bin"
          elif [ -f "$SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            echo "Found sdkmanager in cmdline-tools/bin"
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            cp -R "$SDK_ROOT/cmdline-tools/bin" "$SDK_ROOT/cmdline-tools/latest/"
          else
            echo "Searching for sdkmanager..."

            SDKMANAGER=$(find "$SDK_ROOT" "$HOME/.buildozer" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1 || true)

            if [ -n "$SDKMANAGER" ]; then
              echo "Found: $SDKMANAGER"

              SDK_BIN="$(dirname "$SDKMANAGER")"

              mkdir -p "$SDK_ROOT/cmdline-tools/latest"

              cp -R "$SDK_BIN/." "$SDK_ROOT/cmdline-tools/latest/"
            fi
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "Searching entire runner..."

            find "$HOME" -type f -name sdkmanager 2>/dev/null || true

            exit 1
          fi

          chmod +x "$SDKMANAGER"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "sdkmanager:"
          "$SDKMANAGER" --version

          echo "=========================================="
          echo "ANDROID SDK READY"
          echo "=========================================="

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

          yes | "$SDKMANAGER" --licenses || true

      - name: Prepare Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "BUILDOZER CONFIGURATION"
          echo "=========================================="

          buildozer --version

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi

          echo "buildozer.spec found."

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "ANDROID SDK LICENSES"
          echo "=========================================="

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          echo "=========================================="
          echo "BUILD APK"
          echo "=========================================="

          buildozer android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-APK
          path: bin/*.apk
          if-no-files-found: error

